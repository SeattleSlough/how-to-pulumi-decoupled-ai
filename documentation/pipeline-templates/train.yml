# yaml-language-server: $schema=none

# File: .github/workflows/train.yml
name: CoreWeave AI Production Processing Pipeline

on:
  push:
    branches:
      - main # Triggers deployments on pushes to production tracking branches

jobs:
  # ==============================================================================
  # STAGE 1: LOCAL CONTINUOUS INTEGRATION (ZERO-COST UNIT TESTING)
  # ==============================================================================
  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Core Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Test Infrastructure Definitions (Data Platform Stack)
        run: |
          python -m pip install --upgrade pip
          pip install -r infra-data-platform/requirements.txt pytest
           # Explicitly tell Python to treat the repository root as a source directory:
          PYTHONPATH=. pytest infra-data-platform/tests/

      - name: Test Infrastructure Definitions (ML Compute Stack)
        run: |
          pip install -r infra-ml-compute/requirements.txt pytest
           # Explicitly tell Python to treat the repository root as a source directory:
          PYTHONPATH=. pytest infra-ml-compute/tests/

  # ==============================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT (JUST-IN-TIME GPU PROVISIONING)
  # ==============================================================================
  execute_gpu_workload:
    needs: run_unit_tests # BLOCK DEPLOYMENT: Tests must pass cleanly first
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Requesting the dynamic OIDC JWT to swap identities with AWS
      contents: read

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate with AWS via Passwordless OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GithubActionsCoreWeavePulumiRole
          aws-region: us-east-1
          audience: ://amazonaws.com

      - name: Inject CoreWeave Dynamic Access Manifests
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.COREWEAVE_KUBECONFIG }}" > ~/.kube/config-coreweave

      - name: Set up Pulumi CLI Engine
        uses: pulumi/actions@v5

      - name: Install Runtime Stack Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra-ml-compute/requirements.txt

      # 1. Run 'pulumi up' to spin up the CoreWeave storage structures and request H100 clusters
      - name: Initialize Ephemeral GPU Cluster
        id: pulumi_up
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: production
          work-dir: infra-ml-compute
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # 2. Watch logs in real-time. If the script fails, step fails, which skips the teardown below
      - name: Stream Training Interceptions & Monitor Traps
        run: |
          export KUBECONFIG=~/.kube/config-coreweave
          echo "Awaiting physical hardware allocation on CoreWeave fabric..."

          kubectl logs -f pod/llama3-70b-trainer -n ephemeral-training-runners --kubeconfig=~/.kube/config-coreweave
          CONTAINER_EXIT_CODE=$(kubectl get pod llama3-70b-trainer -n ephemeral-training-runners -o jsonpath='{.status.containerStatuses.state.terminated.exitCode}' --kubeconfig=~/.kube/config-coreweave)

          if [ "$CONTAINER_EXIT_CODE" -eq "0" ]; then
            echo "SUCCESS: Training loop completed normally."
          else
            echo "CRITICAL WARNING: Training job crashed. Issuing engineering alerts."

            # 1. SEND SLACK NOTIFICATION
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🚨 *ML Cluster Crash Alert*: `llama3-70b-trainer` failed. Compute node and NVMe local storage are frozen for engineering inspection. Check GitHub run: https://github.com'"${{ github.repository }}"'/actions/runs/'"${{ github.run_id }}"'"}' \
              ${{ secrets.SLACK_WEBHOOK_URL }}

            # 2. TRIGGER PAGERDUTY INCIDENT ROUTING
            curl -X POST https://pagerduty.com \
              -H 'Content-Type: application/json' \
              -d '{
                "routing_key": "'"${{ secrets.PAGERDUTY_ROUTING_KEY }}"'",
                "event_action": "trigger",
                "payload": {
                  "summary": "CoreWeave GPU Cluster Training Failure: NVMe Frozen for Debugging",
                  "source": "GitHub Actions AI Pipeline",
                  "severity": "critical"
                }
              }'

            exit 1 # Fail the step to block automated destroy execution
          fi

      # 3. CLEANUP LAYER: Runs only if all training blocks passed without flagging errors
      - name: Automated Cost-Optimized GPU Teardown
        if: success()
        uses: pulumi/actions@v5
        with:
          command: destroy
          stack-name: production
          work-dir: infra-ml-compute
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}


# ==============================================================================
# INFRASTRUCTURE FRAMEWORK OVERRIDES & POLICIES
# ==============================================================================
# The metadata fields below explicitly inform security engines and policy utilities
# that this config handles pipeline routing and is NOT a deployable Kubernetes resource.
metadata:
  labels:
    infrastructure-plane: github-actions-workflow
    deployment-type: pipeline-orchestration
    resource-schema: automation.github.v1
  annotations:
    kubernetes.io/managed-by: github-actions
    policy.engine.override/ignore-k8s-schemas: "true"
    description: "Multi-cloud infrastructure orchestration blueprint. Do not apply to clusters."
